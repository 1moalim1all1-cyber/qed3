<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الفاتورة | Qed3</title><link rel="stylesheet" href="styles.css"><style>body{background:#e9eef1;color:#162029;font-family:Tahoma,Arial,sans-serif}.invoiceWrap{max-width:920px;margin:30px auto;background:white;border-radius:18px;padding:32px;box-shadow:0 12px 32px #0002}.invoiceHeader{display:flex;justify-content:space-between;gap:20px;border-bottom:3px solid #f27f40;padding-bottom:20px}.invoiceHeader h1{margin:0;color:#f27f40}.invoiceGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:25px 0}.invoiceGrid div{background:#f5f7f9;padding:14px;border-radius:10px}.invoiceTable{width:100%;border-collapse:collapse}.invoiceTable td,.invoiceTable th{padding:14px;border-bottom:1px solid #d6e0e6;text-align:right}.invoiceTotal{font-size:25px;text-align:left;padding:25px 0}.invoiceActions{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}.invoiceActions button{border:0;border-radius:8px;padding:12px 18px;background:#10242e;color:white;cursor:pointer}.notice{color:#963e2c} @media print{body{background:white}.invoiceActions,.noPrint{display:none!important}.invoiceWrap{box-shadow:none;margin:0;padding:10px;max-width:none}}@media(max-width:600px){.invoiceGrid{grid-template-columns:1fr}.invoiceWrap{padding:16px}}</style></head><body><main class="invoiceWrap"><div class="invoiceActions"><button id="pdfBtn" disabled>طباعة / حفظ PDF</button><button id="csvBtn" disabled>تصدير Excel (CSV)</button><a href="admin.html">الرجوع للإدارة</a></div><p id="message" role="status">جاري فحص صلاحية المدير وتحميل الطلب…</p><section id="invoice" hidden><div class="invoiceHeader"><div><h1>QED3</h1><p>بيان طلب / فاتورة مبدئية</p></div><div><b id="number"></b><p id="date"></p></div></div><div class="invoiceGrid"><div><b>العميل</b><p id="buyer"></p></div><div><b>بيانات الطلب</b><p id="orderInfo"></p></div></div><table class="invoiceTable"><thead><tr><th>الصنف</th><th>الكمية</th></tr></thead><tbody id="lines"></tbody></table><div class="invoiceTotal" id="total"></div><p id="legalNote">هذا البيان ليس فاتورة ضريبية، ولا يُثبت الدفع. يعتمد الإجمالي النهائي بعد مراجعة المتجر وتأكيد الطلب.</p></section></main><script type="module" src="invoice.js"></script></body></html>
