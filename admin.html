<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة</title><link rel="stylesheet" href="styles.css"><style>.admin{max-width:1100px;margin:40px auto;padding:20px}.adminGrid{display:grid;grid-template-columns:330px 1fr;gap:20px}.admin form,.table{background:#10171c;border:1px solid #303b42;border-radius:10px;padding:18px}.admin input{width:100%;height:40px;margin:6px 0;background:#151d22;color:#fff;border:1px solid #354148;border-radius:6px;padding:0 10px}.rows>div{display:grid;grid-template-columns:1fr 100px 100px;gap:8px;border-bottom:1px solid #2b353b;padding:10px 0}.hint{color:#aeb5b9;font-size:12px}@media(max-width:760px){.adminGrid{grid-template-columns:1fr}}</style></head><body><div class="admin"><div class="titleRow"><h2>لوحة إدارة المنتجات</h2><a href="index.html">← رجوع للمتجر</a></div><p id="status" class="hint" role="status">جاري التحقق من الصلاحيات…</p><form id="loginForm"><h3>دخول المدير</h3><input id="adminEmail" type="email" placeholder="البريد الإلكتروني" required><input id="adminPassword" type="password" placeholder="كلمة المرور" required><button class="primary full">دخول</button></form><div id="adminPanel" hidden><button id="logoutBtn" type="button">تسجيل الخروج</button><div class="adminGrid"><form id="pform"><h3>إضافة منتج</h3><input id="pname" placeholder="اسم المنتج" required><input id="pbrand" placeholder="العلامة التجارية"><input id="pretail" type="number" min="0" step="0.01" placeholder="سعر القطاعي" required><input id="pwholesale" type="number" min="0" step="0.01" placeholder="سعر الجملة" required><input id="pimg" placeholder="رابط/مسار الصورة"><button class="primary full">إضافة المنتج</button></form><div class="table"><h3>المنتجات</h3><div id="rows" class="rows"></div></div></div><div class="table" style="margin-top:20px"><h3>آخر 100 طلب للمراجعة</h3><button type="button" id="exportOrders">تصدير الطلبات Excel / CSV</button><div id="ordersRows" class="rows"></div></div></div></div><script type="module" src="admin.js"></script></body></html>
