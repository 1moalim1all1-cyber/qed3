<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ملفي الشخصي | Qed3</title><link rel="stylesheet" href="styles.css"><style>.profileWrap{max-width:700px;margin:35px auto;padding:18px}.profileBox{padding:25px;border:1px solid #42505c;background:#111c26;border-radius:23px}.profileBox label{display:block;margin:14px 0 7px}.profileBox input:not([type=checkbox]),.profileBox textarea{width:100%;min-height:44px;border:1px solid #425461;border-radius:9px;background:#192630;color:white;padding:12px;font-size:16px}.profileAvatar{width:110px;height:110px;object-fit:cover;border-radius:50%;background:#253640;margin:15px 0}.profileBox .hint{color:#b7c7cf;font-size:13px;line-height:1.7}.profileBox button{padding:12px 18px;border:0;border-radius:12px;background:#f29252;cursor:pointer;font-weight:700}.profileGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.profileGrid{grid-template-columns:1fr}}</style></head><body><main class="profileWrap"><a href="shop.html">← العودة للمتجر</a><div class="profileBox"><h1>ملفي الشخصي</h1><p class="hint">الصورة والبيانات والموقع اختيارية. بياناتك مش هتظهر للناس إلا لما توافق على النشر.</p><form id="profileForm"><img id="avatarPreview" class="profileAvatar" src="assets/prod1.png" alt="الصورة الشخصية"><label>الصورة الشخصية</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><label>الاسم</label><input id="name" maxlength="100" required><label>رقم التواصل</label><input id="phone" maxlength="20" inputmode="tel"><div class="profileGrid"><div><label>المحافظة</label><input id="governorate" maxlength="80"></div><div><label>المنطقة / المدينة</label><input id="area" maxlength="100"></div></div><label>عنوان النشاط أو مكان التواصل (اختياري)</label><textarea id="address" maxlength="250"></textarea><div class="profileGrid"><div><label>خط العرض GPS</label><input id="lat" type="number" min="-90" max="90" step="any"></div><div><label>خط الطول GPS</label><input id="lng" type="number" min="-180" max="180" step="any"></div></div><button id="gps" type="button">📍 تحديد موقعي بموافقتي</button><p class="hint">استخدم موقع المحل أو نقطة مقابلة عامة، مش عنوان البيت. دقة GPS قد تختلف.</p><label><input id="public" type="checkbox"> أوافق على نشر صورتي وبيانات التواصل والموقع للزوار في دليل Qed3</label><p class="hint">لو ألغيت الاختيار، بيانات الملف العامة هتتشال من الدليل.</p><button id="save" type="submit">حفظ الملف الشخصي</button><p id="message" role="status"></p></form></div></main><script type="module" src="profile.js"></script><script type="module" src="floating-whatsapp.js?v=4"></script><script type="module" src="chat.js?v=4"></script></body></html>
